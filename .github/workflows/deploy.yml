# Deploys the DriftSense CDK app to ap-south-1 via GitHub OIDC (no long-lived AWS keys).
# Prerequisites (one-time, human): cdk bootstrap; deploy DriftSense-GithubOidc once from a laptop;
# repo variables AWS_DEPLOY_ROLE_ARN, COOL_AMI_ID, ALERT_EMAIL.
# ENGINE_GIT_SHA stays the v2-freeze SHA (infra default); it is NOT the deploy commit.
# The API Lambda bundle is pip-installed for manylinux aarch64 at synth (no Docker needed).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "service/**"
      - "driftsense/**"
      - "requirements*.lock"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            infra/requirements.txt
            requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Install CDK CLI (pinned)
        working-directory: infra
        run: npm ci

      - name: Install CDK Python deps
        run: pip install -r infra/requirements.txt

      - name: cdk deploy
        working-directory: infra
        run: >-
          npx cdk deploy --all --require-approval never
          -c cool_ami_id=${{ vars.COOL_AMI_ID }}
          -c alert_email=${{ vars.ALERT_EMAIL }}
          -c api_asset=service
