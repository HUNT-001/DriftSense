name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - run: python -m pip install -r requirements.lock && python -m pip install -e . --no-deps
      - run: python -c "import cv2, numpy; assert cv2.__version__.startswith('5.0.0'), cv2.__version__; assert numpy.__version__.startswith('2.'), numpy.__version__; print(cv2.__version__, numpy.__version__)"
      - run: make test
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - run: python -m pip install -r requirements.lock && python -m pip install -e . --no-deps
      - run: make contracts-check && python -m pytest -q tests/contract
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff && make lint
  claims:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - run: python -m pip install -r requirements.lock && python -m pip install -e . --no-deps
      - run: make claims
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-tools && make lock && git diff --exit-code requirements.lock requirements-cool.lock
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m pip install -r requirements.lock && python -m pip install -e . --no-deps
      - run: test ! -f infra/requirements.txt || (python -m pip install -r infra/requirements.txt && python -m pytest -q tests/infra)
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: test ! -f ui/package.json || (cd ui && npm ci && npm test && npm run build)
